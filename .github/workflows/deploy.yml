name: Деплой на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Установка зависимостей
        run: yarn install --frozen-lockfile

      - name: Линтер
        run: yarn lint

      - name: Сборка приложения
        run: yarn build
        env:
          # Приложение живёт в подпапке https://malirue.github.io/project-lib/
          VITE_BASE: /project-lib/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
